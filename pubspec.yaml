name: nexsoft_server_mcp
description: MCP server for the nexsoft_server CI/build REST API.
publish_to: none
version: 6.2.0

environment:
  # As low as its packages allow, since anyone's machine runs it: dart_mcp
  # needs 3.7 and nexsoft_server_shared 3.9. No lock is committed, so each SDK
  # gets the package versions it can take.
  sdk: ^3.9.0

dependencies:
  dart_mcp: ^0.5.2
  nexsoft_server_shared:
    git:
      url: https://github.com/dyno-nexsoft/nexsoft_server_shared.git
      # A commit, not `main`: what this builds against does not move under it,
      # and a clone later gets the models it was written for. Bump it with the
      # shared package.
      ref: 351e186d73c5ef28497699a73a7f70aa202ff69d
  http: ^1.2.0

dev_dependencies:
  lints: ^6.1.0
