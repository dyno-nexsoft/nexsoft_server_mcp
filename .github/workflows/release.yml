name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      # No `dart test`: this package has no tests of its own any more (they
      # live with the server), and `dart test` fails when there is no test/.
      - run: dart compile exe bin/nexsoft_server_mcp.dart -o nexsoft_server_mcp
      - uses: softprops/action-gh-release@v2
        with:
          files: nexsoft_server_mcp
